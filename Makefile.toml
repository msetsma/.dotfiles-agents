# ==============================================================================
# Makefile.toml - agent config management (cargo-make)
# ==============================================================================
#   cargo make sync          # render + merge the catalog into every agent
#   cargo make agent-check   # dry-run: show what would change
# ==============================================================================

[tasks.sync]
description = "Render + merge the catalog into every agent"
dependencies = ["agent-sync"]

[tasks.agent-sync]
description = "Render + merge the catalog into every agent config"
script = ["bin/agent-sync"]

[tasks.agent-check]
description = "Dry-run: show what agent-sync would change (writes nothing)"
script = ["bin/agent-sync --dry-run"]

[tasks.agent-outdated]
description = "Check npm / uv tools / git checkouts for newer versions"
script = ["bin/agent-update"]

[tasks.agent-update]
description = "Apply available MCP + runtime updates, then re-sync configs"
script = ["bin/agent-update --apply"]
