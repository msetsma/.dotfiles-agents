# dotter global config for the MCP dotfiles repo.
# Source directory: ~/.mcp   Target: this machine.
#
# Only *pure-MCP* client configs are deployed here. VS Code's mcp.json is the
# one file that is nothing but MCP, so dotter owns it outright via a symlink.
# Every other client (Claude Code, Claude Desktop, Codex, opencode) is a shared,
# stateful file - dotter can only symlink or template, not merge - so those are
# handled by bin/mcp-sync (run from .dotter/pre_deploy.sh before deploy).
#
# The generated/ files are produced by that pre-deploy hook.

[mac.files]
"generated/vscode.json" = "~/Library/Application Support/Code/User/mcp.json"

[common.files]
# Nothing yet. Add cross-platform, purely-MCP config files here if they appear.
