[project]
name = "entra-mcp"
version = "0.1.0"
description = "Read-only Entra ID org-structure and access analysis (people, groups, reports, membership comparison) via a delegated Azure CLI session, exposed as a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The CLI is pure standard library: no runtime dependencies. Auth is delegated
# to the `az` CLI, which is already on the machine.
dependencies = []

[project.optional-dependencies]
mcp = ["fastmcp>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
entra = "entra_tool.app:cli_entry"
entra-mcp = "entra_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["entra_tool", "entra_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
