[project]
name = "teams-browser"
version = "0.1.0"
description = "Read-only Microsoft Teams access (meetings, transcripts, ad-hoc/1:1 calls, chats, channel messages, shared files) via browser-session tokens, exposed as a CLI, local archive and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "playwright>=1.45",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
teams-browser = "teams_browser.cli:app"
teams-browser-mcp = "teams_browser.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: opt-in tests that hit the real Teams endpoints (need TEAMS_BROWSER_LIVE=1)",
]
