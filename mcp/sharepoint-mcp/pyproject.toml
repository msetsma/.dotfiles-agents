[project]
name = "sharepoint-mcp"
version = "0.1.0"
description = "Read-only-by-default MCP server for SharePoint: OneDrive-synced libraries on disk and SharePoint lists via Microsoft Graph (Azure CLI token)"
requires-python = ">=3.14"
# 2.0+ required: code uses MCPServer (renamed from FastMCP) and
# snake_case ToolAnnotations fields, neither of which exist in 1.x.
dependencies = [
    "defusedxml>=0.7.1",
    "mcp>=2.0,<3",
]

[tool.uv]
package = false
