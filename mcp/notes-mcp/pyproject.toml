[project]
name = "notes-mcp"
version = "0.1.0"
description = "MCP server for the personal Obsidian vault: indexed read/search plus git-backed create/update/move/rename over the Johnny-Decimal x PARA notes vault."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# 2.0+ required: code uses MCPServer (renamed from FastMCP) and snake_case
# ToolAnnotations fields, neither of which exist in 1.x.
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notes-mcp = "notes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: hits the real qmd binary / models (skipped when absent)",
]
