[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-databricks"
version = "0.0.0"
description = "Launcher that runs Databricks' ai-dev-kit MCP server straight from its git source."
requires-python = ">=3.14"
dependencies = [
    # ai-dev-kit ships its MCP server as two in-repo packages (no PyPI release
    # for databricks-tools-core), so both are pulled from the same pinned tag.
    # `make agent-update` bumps this tag.
    "databricks-mcp-server @ git+https://github.com/databricks-solutions/ai-dev-kit.git@v0.2.0#subdirectory=databricks-mcp-server",
    "databricks-tools-core @ git+https://github.com/databricks-solutions/ai-dev-kit.git@v0.2.0#subdirectory=databricks-tools-core",
]

[project.scripts]
databricks-mcp = "mcp_databricks_launcher:main"

[tool.setuptools]
py-modules = ["mcp_databricks_launcher"]
