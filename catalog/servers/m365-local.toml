name        = "m365-local"
description = "Read-only local Outlook meetings (Calendar.app), Mail.app search, and synced SharePoint files."
kind        = "local"
origin      = "custom"
clients     = ["opencode", "claude-code", "claude-desktop"]

[launch]
command = "uv"
args    = ["run", "--directory", "${AGENT_HOME}/mcp/m365-local-mcp", "server.py"]

[package]
manager = "source"
path    = "${AGENT_HOME}/mcp/m365-local-mcp"
