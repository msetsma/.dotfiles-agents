# Runs after the agent writes or edits a Python file: ruff auto-fixes and
# formats what it can, then the remaining findings are handed back to the model
# to fix. Suppressions (`# noqa`) are ignored on the final pass, so the only
# accepted resolution is a real fix.
#
# Ruff's config is resolved from the git project root (ruff.toml, .ruff.toml, or
# a pyproject.toml with [tool.ruff]), falling back to the global ruff config.
# `clean-python --waive <file>` records a user-approved off-topic skip, which
# both this hook and the Stop hook then honour.
#
# Files that are still broken are recorded for the companion python-clean-stop
# hook, which refuses to end the turn until they pass.
#
# The logic lives in bin/clean-python, which is shared with the opencode plugin
# of the same name (delivered via the `plugins` kind).

name        = "python-clean"
description = "Ruff check --fix + format agent-written Python, then report and enforce what could not be fixed."
event       = "PostToolUse"
matcher     = "Write|Edit|MultiEdit"
clients     = ["claude-code"]

[command]
run           = "${AGENT_HOME}/bin/clean-python"
timeout       = 30
statusMessage = "ruff: fix + verify"
