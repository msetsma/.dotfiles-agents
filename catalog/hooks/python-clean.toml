# Runs after the agent writes or edits a Python file: ruff auto-fixes and
# formats (unless that would rewrite legacy code), bin/python_gate.py adds the
# file-local checks ruff cannot express (file length, mutable dataclasses,
# suppression comments, swallowed errors), then the remaining findings are
# handed back to the model to fix. Suppressions (`# noqa`) are ignored, so the
# only accepted resolution is a real fix.
#
# Only findings the edit introduced are reported: the gate compares the file
# with its version at git HEAD, so pre-existing findings in untouched legacy
# code do not block. A file with no committed version must be fully clean.
#
# Ruff's config is resolved from the git project root (ruff.toml, .ruff.toml, or
# a pyproject.toml with [tool.ruff]), falling back to the global ruff config.
# `clean-python --waive <file>` records a user-approved off-topic skip, which
# both this hook and the Stop hook then honour.
#
# Every file this hook checks is recorded for the companion python-clean-stop
# hook, which adds vulture and ty and refuses to end the turn until they pass.
#
# The logic lives in bin/clean-python, which is shared with the opencode plugin
# of the same name (delivered via the `plugins` kind).

name        = "python-clean"
description = "Ruff check --fix + format agent-written Python, then report and enforce the findings the edit introduced."
event       = "PostToolUse"
matcher     = "Write|Edit|MultiEdit"
clients     = ["claude-code"]

[command]
run           = "${AGENT_HOME}/bin/clean-python"
timeout       = 90
statusMessage = "ruff: fix + verify"
