# Machine-specific bits of the catalog, as set on the primary (macOS) machine.
#
# Server definitions reference these logical command names and ${VARS} instead
# of absolute paths, so `catalog/mcp/*.toml` stays portable between machines.
# Override any of them per machine in the untracked catalog/local.toml (see
# catalog/local.toml.example) rather than editing this tracked file.

[commands]
npx            = "/opt/homebrew/bin/npx"
uv             = "/opt/homebrew/bin/uv"
apple-mail-mcp = "/Users/msetsma/.local/bin/apple-mail-mcp"
entra-mcp      = "/Users/msetsma/.local/bin/entra-mcp"
imcp           = "/Applications/iMCP.app/Contents/MacOS/imcp-server"

[vars]
AGENT_HOME = "~/.dotfiles-agents"
# obscura binary the browser facade drives (not registered as its own server)
OBSCURA    = "/Users/msetsma/.local/bin/obscura"
