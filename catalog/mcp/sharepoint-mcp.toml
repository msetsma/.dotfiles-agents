name        = "sharepoint-mcp"
description = "SharePoint: OneDrive-synced libraries on disk plus SharePoint lists via Microsoft Graph (Azure CLI token). Read-only by default; list writes are opt-in via SHAREPOINT_ENABLE_WRITES."
kind        = "local"
origin      = "custom"
clients     = ["opencode", "claude-code", "claude-desktop"]
tags        = ["work", "macos"]

[launch]
command = "uv"
args    = ["run", "--directory", "${AGENT_HOME}/vendor/sharepoint-mcp", "server.py"]

# Source lives in its own repo; `make agent-update` clones it into vendor/.
[package]
manager = "git"
repo    = "msetsma/sharepoint-mcp"
path    = "${AGENT_HOME}/vendor/sharepoint-mcp"
