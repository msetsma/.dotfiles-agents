name        = "teams-browser"
description = "Read-only Teams meetings, transcripts, chats, channel messages and shared files via browser session tokens + a local SQLite archive."
kind        = "local"
origin      = "custom"
clients     = ["opencode", "claude-code", "claude-desktop"]
tags        = ["work"]

[launch]
command = "uv"
args    = ["run", "--directory", "${AGENT_HOME}/vendor/teams-mcp", "--extra", "mcp", "teams-browser-mcp"]

# Source lives in its own repo; `make agent-update` clones it into vendor/.
[package]
manager = "git"
repo    = "msetsma/teams-mcp"
path    = "${AGENT_HOME}/vendor/teams-mcp"
