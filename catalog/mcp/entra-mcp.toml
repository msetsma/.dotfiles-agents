name        = "entra-mcp"
description = "Entra ID org structure and access analysis (people, groups, reporting trees, manager lookup). Ships the `entra` CLI."
kind        = "local"
origin      = "custom"
clients     = ["opencode", "claude-code", "claude-desktop", "codex"]
tags        = ["work"]

[launch]
command = "entra-mcp"
args    = []

# Source lives in its own repo; `make agent-update` clones it into vendor/.
[package]
manager = "git"
repo    = "msetsma/entra-mcp"
path    = "${AGENT_HOME}/vendor/entra-mcp"
