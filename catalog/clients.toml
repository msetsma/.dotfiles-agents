# Where each agent keeps each *kind* of resource, and how it spells them.
#
# One block per (client, kind). Kinds the repo knows about:
#
#   [<client>.mcp]      MCP servers
#       format      = how the file is parsed/written (json / jsonc / toml)
#       container   = key path to the server map
#       style       = renderer that speaks this agent's dialect
#       inject_path = PATH to add to every server's env (GUI apps need it)
#
#   [<client>.skills]   agent skills
#       path        = directory holding one folder per skill
#
#   [<client>.plugins]  agent plugins (one .ts file per plugin, symlinked)
#       path        = directory to link the plugin files into
#
#   [<client>.hooks]    event hooks
#       format      = json
#       container   = key path to the event -> hook-list map
#       style       = hook renderer (claude-code / codex)
#
#   [<client>.instructions]  global instruction file (managed markdown block)
#       path        = the client's global instruction file (AGENTS.md / CLAUDE.md)
#
#   [<client>.packages]  pi packages (merged into the settings `packages` list)
#       path        = the client's settings.json
#       install     = command run after packages are added/changed

[opencode.mcp]
path      = "~/.config/opencode/opencode.jsonc"
format    = "jsonc"
container = ["mcp", "servers"]
style     = "opencode"

# opencode also loads ~/.claude/skills (its "Claude-compatible" global path), so
# it inherits Claude Code's skills. Add [opencode.skills] only if you want
# skills in opencode's own directory instead.

# Plugins are discovered automatically from this directory (direct .ts/.js
# files), so agent-sync only has to symlink them in.
[opencode.plugins]
path = "~/.config/opencode/plugins"

# opencode V2 loads only AGENTS.md for global instructions (its `instructions`
# config array is inert). agent-sync owns a marked block inside it and leaves
# anything written outside the markers alone.
[opencode.instructions]
path = "~/.config/opencode/AGENTS.md"

[claude-code.mcp]
path      = "~/.claude.json"
format    = "json"
container = ["mcpServers"]
style     = "claude-code"

[claude-code.skills]
path = "~/.claude/skills"

[claude-code.hooks]
path      = "~/.claude/settings.json"
format    = "json"
container = ["hooks"]
style     = "claude-code"

[claude-desktop.mcp]
path        = "~/Library/Application Support/Claude/claude_desktop_config.json"
format      = "json"
container   = ["mcpServers"]
style       = "claude-desktop"
inject_path = "/Users/msetsma/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

[codex.mcp]
path      = "~/.codex/config.toml"
format    = "toml"
container = ["mcp_servers"]
style     = "codex"

[codex.hooks]
path      = "~/.codex/hooks.json"
format    = "json"
container = ["hooks"]
style     = "codex"

# pi rewrites settings.json itself (changelog version, `pi install`, `pi config`),
# so agent-sync only merges the `packages` list: catalog entries are replaced by
# identity (source minus @version), hand-installed packages are left alone.
# Declaring a package doesn't download it; `install` reconciles node_modules.
[pi.packages]
path    = "~/.pi/agent/settings.json"
install = ["pi", "update", "--extensions"]
