# Where each agent keeps each *kind* of resource, and how it spells them.
#
# One block per (client, kind). Kinds the repo knows about:
#
#   [<client>.mcp]      MCP servers
#       format      = how the file is parsed/written (json / jsonc / toml)
#       container   = key path to the server map
#       style       = renderer that speaks this agent's dialect
#       inject_path = PATH to add to every server's env (GUI apps need it)
#
#   [<client>.skills]   agent skills
#       path        = directory holding one folder per skill
#
#   [<client>.hooks]    event hooks
#       format      = json
#       container   = key path to the event -> hook-list map
#       style       = hook renderer (claude-code / codex)

[opencode.mcp]
path      = "~/.config/opencode/opencode.jsonc"
format    = "jsonc"
container = ["mcp", "servers"]
style     = "opencode"

# opencode also loads ~/.claude/skills (its "Claude-compatible" global path), so
# it inherits Claude Code's skills. Add [opencode.skills] only if you want
# skills in opencode's own directory instead.

[claude-code.mcp]
path      = "~/.claude.json"
format    = "json"
container = ["mcpServers"]
style     = "claude-code"

[claude-code.skills]
path = "~/.claude/skills"

[claude-code.hooks]
path      = "~/.claude/settings.json"
format    = "json"
container = ["hooks"]
style     = "claude-code"

[claude-desktop.mcp]
path        = "~/Library/Application Support/Claude/claude_desktop_config.json"
format      = "json"
container   = ["mcpServers"]
style       = "claude-desktop"
inject_path = "/Users/msetsma/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

[codex.mcp]
path      = "~/.codex/config.toml"
format    = "toml"
container = ["mcp_servers"]
style     = "codex"

[codex.hooks]
path      = "~/.codex/hooks.json"
format    = "json"
container = ["hooks"]
style     = "codex"
