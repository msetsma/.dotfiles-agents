# Resources that are no longer wanted.
#
# agent-sync scrubs these from every client it manages. Names are kept here
# even after the local files are clean, so a stale config on another machine
# gets scrubbed on its next sync too. Entries take ~ and catalog ${VARS}
# (AGENT_HOME, HOME, ...) like the rest of the catalog.
#
#   mcp           MCP server names
#   skills        skill names (symlinks are removed)
#   plugins       plugin names (symlinks are removed; marketplace plugins are
#                 disabled and uninstalled, orphaned marketplaces removed)
#   instructions  instruction overlay names (removed from the managed block)
#   packages      pi package sources, e.g. "npm:pi-foo" (dropped from settings.json)
#   hook_commands exact shell commands of retired hooks (scrubbed from the
#                 managed event maps)

mcp           = ["notion", "m365-local", "obscura"]
skills        = []
plugins       = ["context-mode"]
instructions  = []
# Whole pi package set retired (clean slate).
packages      = [
  "npm:@juicesharp/rpiv-ask-user-question",
  "npm:@juicesharp/rpiv-todo",
  "npm:pi-goal-x",
  "npm:pi-open-tui",
  "npm:pi-subagents",
  "npm:pi-tool-display",
  "npm:pi-zentui",
  "${AGENT_HOME}/packages/pi-quiet",
  "${AGENT_HOME}/packages/pi-sidebar",
]
hook_commands = [
  # Hand-written `ruff format` PostToolUse hook, superseded by python-clean.
  '''jq -r ".tool_response.filePath // .tool_input.file_path // empty" | { read -r f; case "$f" in *.py|*.pyi) r="$(git -C "$(dirname "$f")" rev-parse --show-toplevel 2>/dev/null)/.venv/bin/ruff"; [ -x "$r" ] || r=ruff; "$r" format -q "$f";; esac; } 2>/dev/null || true''',
  # python-clean commands under the ~/.agentdots path. Their command string
  # differs from the catalog's ~/.dotfiles-agents one, so sync scrubs them from
  # any config that still has them.
  '''/Users/msetsma/.agentdots/bin/clean-python --stop-check''',
  '''/Users/msetsma/.agentdots/bin/clean-python''',
  # Cache self-heal hook the context-mode plugin deployed for itself.
  '''node "C:/Users/2015m/.claude/hooks/context-mode-cache-heal.mjs"''',
  '''node "/Users/msetsma/.claude/hooks/context-mode-cache-heal.mjs"''',
]
