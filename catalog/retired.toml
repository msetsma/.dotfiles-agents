# Resources that are no longer wanted.
#
# agent-sync scrubs these from every client it manages. Names are kept here
# even after the local files are clean, so a stale config on another machine
# gets scrubbed on its next sync too.
#
#   mcp           MCP server names
#   skills        skill names (symlinks are removed)
#   plugins       plugin names (symlinks are removed)
#   instructions  instruction overlay names (removed from the managed block)
#   hook_commands exact shell commands of retired hooks (scrubbed from the
#                 managed event maps)

mcp           = ["notion"]
skills        = []
plugins       = []
instructions  = []
hook_commands = [
  # Hand-written `ruff format` PostToolUse hook, superseded by python-clean.
  '''jq -r ".tool_response.filePath // .tool_input.file_path // empty" | { read -r f; case "$f" in *.py|*.pyi) r="$(git -C "$(dirname "$f")" rev-parse --show-toplevel 2>/dev/null)/.venv/bin/ruff"; [ -x "$r" ] || r=ruff; "$r" format -q "$f";; esac; } 2>/dev/null || true''',
  # python-clean commands written with the pre-rename ~/.agentdots path; the
  # rename to ~/.dotfiles-agents changed the command string, so dedup no longer
  # recognised them and sync added a second copy. Kept here so every machine
  # (and any stale config) gets the old-path duplicates scrubbed on next sync.
  '''/Users/msetsma/.agentdots/bin/clean-python --stop-check''',
  '''/Users/msetsma/.agentdots/bin/clean-python''',
]
